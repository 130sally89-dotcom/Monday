<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 귤 뽑기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(#bfe6ff 0%, #e8f7ff 60%, #b9e39a 60%, #8fd06b 100%);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      color: #3b2a14;
    }
    h1 { margin: 0; font-size: 1.8rem; }
    .count { font-size: 1.1rem; }
    .count b { font-size: 1.6rem; color: #e8710a; }
    #stage { width: min(380px, 90vw); height: auto; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    #tree { transform-origin: 200px 380px; transition: transform .15s; }
    #tree.shake { animation: shake .35s; }
    @keyframes shake {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }
    .fall { animation: fall .8s cubic-bezier(.5, 0, 1, .6) forwards; }
    @keyframes fall {
      to { transform: translateY(var(--dy)); opacity: .0; }
    }
    .grow { animation: grow .5s ease-out; transform-box: fill-box; transform-origin: center; }
    @keyframes grow { from { transform: scale(0); } to { transform: scale(1); } }
    #card {
      width: min(340px, 90vw);
      min-height: 130px;
      padding: 16px 20px;
      background: #fffaf0;
      border: 3px solid #f6a21e;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .15);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }
    #card.pop { animation: pop .4s ease-out; }
    @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #jeju { font-size: 1.5rem; font-weight: bold; color: #d9620a; }
    #mean { font-size: 1.05rem; }
    #hint { color: #7a6a55; }
  </style>
</head>
<body>
  <h1>🍊 제주 귤 뽑기</h1>
  <div class="count">뽑은 귤 <b id="num">0</b>개</div>

  <svg id="stage" viewBox="0 0 400 420" role="button" aria-label="귤나무를 눌러 귤 뽑기">
    <g id="tree">
      <rect x="182" y="240" width="36" height="140" rx="8" fill="#8b5a2b"/>
      <circle cx="200" cy="170" r="120" fill="#3f9b3a"/>
      <circle cx="120" cy="210" r="70" fill="#48a843"/>
      <circle cx="280" cy="210" r="70" fill="#48a843"/>
      <circle cx="200" cy="100" r="70" fill="#4cae46"/>
      <g id="fruits"></g>
    </g>
    <g id="drops"></g>
  </svg>

  <div id="card">
    <div id="hint">나무를 눌러 귤을 따 보세요!</div>
  </div>

  <script>
    var SPOTS = [
      [150, 110], [215, 85], [255, 135], [120, 170],
      [190, 160], [285, 190], [150, 235], [235, 225]
    ];
    var WISHES = [
      ["혼저 옵서예", "어서 오세요"],
      ["폭삭 속았수다", "정말 수고 많으셨습니다"],
      ["하영 먹읍서", "많이 드세요"],
      ["고맙수다", "고맙습니다"],
      ["복 하영 받읍서", "복 많이 받으세요"],
      ["몬딱 잘 될 거우다", "다 잘 될 거예요"],
      ["괜찮수다", "괜찮습니다"],
      ["잘 갑서양", "안녕히 가세요"],
      ["아프지 말앙 살읍서", "아프지 말고 건강하게 지내세요"],
      ["혼저 먹읍서", "어서 드세요"]
    ];
    var NS = "http://www.w3.org/2000/svg";
    var fruits = document.getElementById("fruits");
    var drops = document.getElementById("drops");
    var tree = document.getElementById("tree");
    var card = document.getElementById("card");
    var numEl = document.getElementById("num");
    var count = 0, last = -1;
    var slots = [];

    function makeFruit(x, y, animate) {
      var g = document.createElementNS(NS, "g");
      var c = document.createElementNS(NS, "circle");
      c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 17);
      c.setAttribute("fill", "#ff9a1f"); c.setAttribute("stroke", "#e07800"); c.setAttribute("stroke-width", 2);
      var leaf = document.createElementNS(NS, "ellipse");
      leaf.setAttribute("cx", x + 5); leaf.setAttribute("cy", y - 16); leaf.setAttribute("rx", 7); leaf.setAttribute("ry", 3.5);
      leaf.setAttribute("fill", "#2f7d2c");
      g.appendChild(c); g.appendChild(leaf);
      if (animate) g.classList.add("grow");
      return g;
    }

    SPOTS.forEach(function (p, i) {
      var g = makeFruit(p[0], p[1], false);
      fruits.appendChild(g);
      slots[i] = g;
    });

    function pick() {
      var avail = [];
      slots.forEach(function (s, i) { if (s) avail.push(i); });
      if (!avail.length) return;
      var i = avail[Math.floor(Math.random() * avail.length)];
      var spot = SPOTS[i];

      fruits.removeChild(slots[i]);
      slots[i] = null;

      var d = makeFruit(spot[0], spot[1], false);
      d.style.setProperty("--dy", (385 - spot[1]) + "px");
      d.classList.add("fall");
      drops.appendChild(d);
      setTimeout(function () { drops.removeChild(d); }, 850);

      setTimeout(function () {
        var g = makeFruit(spot[0], spot[1], true);
        fruits.appendChild(g);
        slots[i] = g;
      }, 2000);

      tree.classList.remove("shake"); void tree.getBoundingClientRect(); tree.classList.add("shake");

      var w;
      do { w = Math.floor(Math.random() * WISHES.length); } while (w === last && WISHES.length > 1);
      last = w;
      card.innerHTML = '<div id="jeju"></div><div id="mean"></div>';
      document.getElementById("jeju").textContent = "🍊 " + WISHES[w][0];
      document.getElementById("mean").textContent = "(" + WISHES[w][1] + ")";
      card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");

      count++;
      numEl.textContent = count;
    }

    document.getElementById("stage").addEventListener("click", pick);
  </script>
</body>
</html>
